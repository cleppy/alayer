[workspace]
resolver = "2"
members = ["crates/engine-api", "crates/core", "crates/engine-http", "apps/cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
layer-engine-api = { path = "crates/engine-api" }
layer-core = { path = "crates/core" }
layer-engine-http = { path = "crates/engine-http" }
layer-desktop = { path = "apps/desktop/src-tauri" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
tracing = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "deflate"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
wiremock = "0.6"
